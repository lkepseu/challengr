apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
          imagePullPolicy: IfNotPresent  # ✅ évite de retélécharger l’image à chaque redeploiement
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300          # ✅ utile si tu ajoutes un jour Kibana ou Fluentd
          env:
            - name: discovery.type
              value: single-node           # ✅ mode standalone
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"   # ✅ limite mémoire raisonnable pour Minikube
            - name: xpack.security.enabled
              value: "false"               # ✅ parfait pour test local (désactive login)
            - name: xpack.security.http.ssl.enabled
              value: "false"               # ✅ désactive HTTPS (Fluent Bit parle en HTTP)
          readinessProbe:                  # ✅ attend que le service soit prêt avant routing
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          emptyDir: {}                     # ✅ stockage éphémère → parfait pour tests
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200
