apiVersion: v1
kind: Secret
metadata: { name: pg-secret, namespace: challengr }
type: Opaque
stringData:
  POSTGRES_DB: challengr
  POSTGRES_USER: challengr
  POSTGRES_PASSWORD: challengr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pg-pvc, namespace: challengr }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: challengr }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [ { containerPort: 5432 } ]
          envFrom: [ { secretRef: { name: pg-secret } } ]
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
      volumes: [ { name: data, persistentVolumeClaim: { claimName: pg-pvc } } ]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: challengr }
spec:
  selector: { app: postgres }
  ports: [ { port: 5432, targetPort: 5432 } ]
