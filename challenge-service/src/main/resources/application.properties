server.port=8080

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/challengr}
spring.datasource.username=${DB_USER:challengr}
spring.datasource.password=${DB_PASS:challengr}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.challengr=DEBUG
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} [%thread] %-5level %logger{36} - %msg%n
